*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Instrument Sans',system-ui,sans-serif}

nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:500 13px inherit;cursor:pointer}
nav button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
main{max-width:1200px;margin:auto;padding:0 20px 30px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:6px 0 14px}
.bar label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:flex;flex-direction:column;gap:4px}
select{font:500 14px inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:200px}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font:600 18px 'Fraunces',serif;margin:0 0 2px}.sub{color:var(--mut);font-size:13px;margin:0 0 10px}
.cv{position:relative;height:460px}.cv.s{height:380px}
.sc{overflow-x:auto;max-height:480px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:var(--card);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.y{color:var(--acc);font-weight:600}.n{color:var(--acc2);font-weight:600}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.kpi div{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font:600 26px 'Fraunces',serif;color:var(--acc)}.kpi span{font-size:12px;color:var(--mut)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--mut);font-size:12px;gap:10px}
.foot button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font:500 13px inherit}
.note{font-size:12px;color:var(--mut);margin-top:12px;border-left:3px solid var(--acc2);padding-left:10px}
